<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>绑定高德门店</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:  { 50:'#FFF3EE', 100:'#FFE3D7', 400:'#FF7A4A', 500:'#FF5A2E', 600:'#F04A1E' },
        gold:   { 50:'#FFF9E6', 100:'#FFEFC2', 400:'#FFD34E', 500:'#FFB800', 600:'#E6A400', 700:'#B85C00' },
        alipay: '#1677FF',
        gd:     { DEFAULT:'#2E8FFF', 50:'#E6F2FF' },
        ink:    { 900:'#1A1A1A', 700:'#333333', 600:'#666666', 400:'#999999', 300:'#B4B4B4' },
        bg:     '#F5F6F8',
        line:   '#F0F0F0',
        success:'#1EC46C',
        danger: '#FF3B30',
      },
      fontFamily: { num: ['"DIN Alternate"', '"Helvetica Neue"', 'Arial', 'sans-serif'] },
      boxShadow: { card: '0 2px 12px rgba(0,0,0,.04)', cta: '0 8px 20px rgba(255,90,46,.32)' },
    },
  },
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/prototype.css" />
</head>
<body>
<div class="app-page">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <i class="fa-solid fa-signal text-[11px]"></i>
      <i class="fa-solid fa-wifi text-[11px]"></i>
      <span style="font-size:13px;">5G</span>
      <i class="fa-solid fa-battery-full text-[14px]"></i>
    </span>
  </div>

  <!-- 顶部导航 -->
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><i class="fa-solid fa-chevron-left text-[12px]"></i>返回</button>
    <div class="nav-title">绑定高德门店</div>
  </div>

  <!-- 滚动区 -->
  <div class="app-scroll">

    <!-- 步骤条：提交报名 → 绑定门店（当前） → 报名完成 -->
    <div class="card mx-3 mt-3 p-4">
      <div class="flex items-start">
        <!-- ① 提交报名：已完成 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px] invisible"></div>
            <div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style="background:#1677ff;">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <div class="flex-1 h-[2px]" style="background:#1677ff;"></div>
          </div>
          <span class="text-xs text-ink-600 mt-1.5">提交报名</span>
        </div>
        <!-- ② 绑定门店：当前步 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px]" style="background:#1677ff;"></div>
            <div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style="background:#1677ff; box-shadow:0 0 0 4px #e6f2ff;">
              <span class="w-2 h-2 bg-white rounded-full"></span>
            </div>
            <div class="flex-1 h-[2px] bg-line"></div>
          </div>
          <span class="text-xs font-bold mt-1.5" style="color:#1677ff;">绑定门店</span>
          <span class="text-[10px] mt-0.5" style="color:#1677ff;">当前</span>
        </div>
        <!-- ③ 报名完成：未开始 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px] bg-line"></div>
            <div class="w-6 h-6 rounded-full bg-[#E8E8E8] flex items-center justify-center flex-shrink-0">
              <span class="w-2 h-2 bg-white rounded-full"></span>
            </div>
            <div class="flex-1 h-[2px] invisible"></div>
          </div>
          <span class="text-xs text-ink-300 mt-1.5">报名完成</span>
        </div>
      </div>
    </div>

    <!-- 门店ID 表单 -->
    <div class="card mx-3 mt-3 p-4">
      <div class="text-[14px] font-bold text-ink-900">门店ID</div>
      <div class="text-[11.5px] text-ink-400 mt-1">用于展示高德扫街榜评价入口</div>

      <div class="flex items-center gap-2 mt-3">
        <input id="storeId" type="text" placeholder="输入高德门店ID"
               class="flex-1 h-11 px-3.5 rounded-xl border border-line bg-white text-[14px] text-ink-900 placeholder:text-ink-300 focus:outline-none focus:border-[#1677ff]" />
        <button class="h-11 px-4 rounded-xl text-[13.5px] font-semibold text-[#1677ff] active:scale-95 transition-transform"
                style="background:#E6F2FF;" onclick="pasteId()">粘贴</button>
      </div>

      <!-- 获取门店ID 指引：跳转教程页 -->
      <div class="mt-3 pt-3 flex items-center justify-between" style="border-top:1px solid #f0f0f0;">
        <span class="text-[13px] font-semibold text-ink-900">如何获取门店ID</span>
        <a href="https://mdn.alipayobjects.com/huamei_t9et1u/afts/img/A*mLKYR7D_0IIAAAAAgCAAAAgAemKCAQ/original" target="_blank"
           class="text-[13px] font-medium" style="color:#1677FF; text-decoration:none;">查看</a>
      </div>
    </div>

    <div class="h-4"></div>
  </div>

  <!-- 底部提交按钮 -->
  <div class="footer-cta">
    <button class="btn-primary" style="background:linear-gradient(90deg,#4a9bff,#1677ff); box-shadow:0 8px 20px rgba(22,119,255,.32);" onclick="doSubmit()">提交</button>
  </div>

</div>

<script>
  // 粘贴演示门店ID
  function pasteId() {
    document.getElementById('storeId').value = 'GD-210819-001';
  }

  // 提交校验
  function doSubmit() {
    var input = document.getElementById('storeId');
    if (!input.value.trim()) {
      showToast('请先输入门店ID');
      return;
    }
    var btn = event.target;
    var old = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>提交中…';
    setTimeout(function () {
      location.href = 'gd-reviewing.html';
    }, 800);
  }

  // 轻提示
  function showToast(msg) {
    document.querySelectorAll('.toast').forEach(function (t) { t.remove(); });
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 2000);
  }
</script>

</body>
</html>
