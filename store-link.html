<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>关联闪购门店</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand:  { 50:'#FFF3EE', 100:'#FFE3D7', 400:'#FF7A4A', 500:'#FF5A2E', 600:'#F04A1E' },
        gold:   { 50:'#FFF9E6', 100:'#FFEFC2', 400:'#FFD34E', 500:'#FFB800', 600:'#E6A400', 700:'#B85C00' },
        alipay: '#1677FF',
        gd:     { DEFAULT:'#2E8FFF', 50:'#E6F2FF' },
        ink:    { 900:'#1A1A1A', 700:'#333333', 600:'#666666', 400:'#999999', 300:'#B4B4B4' },
        bg:     '#F5F6F8',
        line:   '#F0F0F0',
        success:'#1EC46C',
        danger: '#FF3B30',
      },
      fontFamily: { num: ['"DIN Alternate"', '"Helvetica Neue"', 'Arial', 'sans-serif'] },
      boxShadow: { card: '0 2px 12px rgba(0,0,0,.04)', cta: '0 8px 20px rgba(255,90,46,.32)' },
    },
  },
}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/prototype.css" />
</head>
<body>
<div class="app-page">

  <!-- 状态栏 -->
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <i class="fa-solid fa-signal text-[11px]"></i>
      <i class="fa-solid fa-wifi text-[11px]"></i>
      <span style="font-size:13px;">5G</span>
      <i class="fa-solid fa-battery-full text-[14px]"></i>
    </span>
  </div>

  <!-- 顶部导航 -->
  <div class="navbar">
    <button class="nav-back" onclick="history.back()"><i class="fa-solid fa-chevron-left text-[12px]"></i>返回</button>
    <div class="nav-title">关联闪购门店</div>
  </div>

  <!-- 滚动区 -->
  <div class="app-scroll">

    <!-- 步骤条：提交报名 → 关联门店（当前） → 开通完成 -->
    <div class="card mx-3 mt-3 p-4">
      <div class="flex items-start">
        <!-- ① 提交报名：已完成 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px] invisible"></div>
            <div class="w-6 h-6 rounded-full bg-success flex items-center justify-center flex-shrink-0">
              <i class="fa-solid fa-check text-white text-[10px]"></i>
            </div>
            <div class="flex-1 h-[2px] bg-brand-500"></div>
          </div>
          <span class="text-xs text-ink-600 mt-1.5">提交报名</span>
        </div>
        <!-- ② 关联门店：当前步 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px] bg-brand-500"></div>
            <div class="w-6 h-6 rounded-full bg-brand-500 ring-4 ring-brand-100 flex items-center justify-center flex-shrink-0">
              <span class="w-2 h-2 bg-white rounded-full"></span>
            </div>
            <div class="flex-1 h-[2px] bg-line"></div>
          </div>
          <span class="text-xs font-bold text-brand-500 mt-1.5">关联门店</span>
          <span class="text-[10px] text-brand-500 mt-0.5">当前</span>
        </div>
        <!-- ③ 开通完成：未开始 -->
        <div class="flex-1 flex flex-col items-center">
          <div class="flex items-center w-full">
            <div class="flex-1 h-[2px] bg-line"></div>
            <div class="w-6 h-6 rounded-full bg-[#E8E8E8] flex items-center justify-center flex-shrink-0">
              <span class="w-2 h-2 bg-white rounded-full"></span>
            </div>
            <div class="flex-1 h-[2px] invisible"></div>
          </div>
          <span class="text-xs text-ink-300 mt-1.5">开通完成</span>
        </div>
      </div>
    </div>

    <!-- 录入门店ID 表单 -->
    <div class="card mx-3 mt-3 p-4">
      <div class="text-[14px] font-bold text-ink-900">用于投流曝光</div>

      <!-- 门店ID 输入 -->
      <div class="mt-3">
        <label class="text-[13px] font-semibold text-ink-700">门店ID</label>
        <div class="flex items-center gap-2 mt-1.5">
          <input id="storeId" type="text" placeholder="输入淘宝闪购门店ID"
                 class="flex-1 h-11 rounded-xl border border-line bg-bg px-3.5 text-[14px] text-ink-900 outline-none placeholder:text-ink-300 focus:border-brand-500 focus:bg-white transition-colors" />
          <button onclick="pasteId()" class="h-11 px-3.5 rounded-xl border border-line bg-white text-[13px] font-medium text-ink-700 active:bg-[#f8f8f8] flex-shrink-0">
            <i class="fa-solid fa-paste mr-1 text-[12px]" style="color:#FF5A2E;"></i>粘贴
          </button>
        </div>
      </div>

      <!-- 获取门店ID 指引：跳转教程页 -->
      <div class="mt-3.5 border-t border-line pt-3.5 flex items-center justify-between">
        <span class="text-[13px] font-semibold text-ink-900">如何获取门店ID</span>
        <a href="https://render.alipay.com/p/c/cca00a53f9bb3b8f9916413940746b53/index.html?caprMode=sync" target="_blank"
           class="text-[13px] font-medium" style="color:#1677FF; text-decoration:none;">查看</a>
      </div>
    </div>

    <div class="h-4"></div>
  </div>

  <!-- 底部 CTA -->
  <div class="footer-cta">
    <a href="success.html" id="submitBtn" onclick="return doSubmit(event)" class="btn-primary" style="text-decoration:none;">提交</a>
  </div>

  <!-- 底部 tabBar -->
  <nav class="tabbar" style="margin-top:0;">
    <a class="tab" href="home.html">
      <i class="fa-solid fa-house text-[22px]"></i>
      <span>首页</span>
    </a>
    <a class="tab" href="#">
      <i class="fa-solid fa-comment-dots text-[22px]"></i>
      <span>消息</span>
      <span class="badge">2</span>
    </a>
    <a class="tab" href="#">
      <i class="fa-solid fa-user text-[22px]"></i>
      <span>我的</span>
    </a>
  </nav>

</div>

<script>
  // 轻提示
  function showToast(msg) {
    document.querySelectorAll('.toast').forEach(function (t) { t.remove(); });
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, 2000);
  }

  // 粘贴门店ID（演示：模拟从剪贴板带入）
  function pasteId() {
    var input = document.getElementById('storeId');
    input.value = 'TB-FG-210819-001';
    input.focus();
    showToast('已粘贴门店ID');
  }

  // 提交：校验门店ID非空
  function doSubmit(e) {
    var input = document.getElementById('storeId');
    if (!input.value.trim()) {
      e.preventDefault();
      showToast('请先输入门店ID');
      return false;
    }
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[15px]"></i> 提交中';
    btn.style.pointerEvents = 'none';
    setTimeout(function () {
      // 已开通商家再次关联门店时透传 again，报名页按钮保持「查看流量币」
      var again = new URLSearchParams(window.location.search).get('again') === '1';
      window.location.href = 'flowcoin-reviewing.html' + (again ? '?again=1' : '');
    }, 800);
    return false;
  }
</script>

</body>
</html>
