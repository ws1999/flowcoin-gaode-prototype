<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部功能</title>
<link rel="stylesheet" href="css/prototype.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* ===== 内容区 ===== */

/* 功能分组卡片 */
.group-card {
  background: #fff; border-radius: 16px; padding: 16px 12px 18px; margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.group-title {
  font-size: 16px; font-weight: 600; color: #1f1f1f; margin-bottom: 14px; padding-left: 4px;
  display: flex; align-items: center;
}
.tag-free {
  display: inline-block; margin-left: 8px; padding: 2px 7px;
  background: linear-gradient(90deg,#ff9c3d,#ff7a3d); color: #fff;
  font-size: 10px; font-weight: 500; border-radius: 4px; line-height: 1.2;
}

/* 网格 */
.grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 4px;
}
.grid.col-4 { grid-template-columns: repeat(4, 1fr); }

/* 单元格 */
.cell {
  display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .15s;
  position: relative;
}
.cell:active { transform: scale(0.94); }
.icon-wrap {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative; margin-bottom: 8px;
}
.icon-wrap svg { width: 28px; height: 28px; }
.cell-name {
  font-size: 12px; color: #1f1f1f; text-align: center; line-height: 1.3;
  font-weight: 400;
}
.cell-sub {
  font-size: 11px; color: #8a8a8a; margin-top: 2px; line-height: 1.2;
}

/* 图标背景色（按截图取色） */
.bg-yellow { background: linear-gradient(160deg, #ffe89b, #ffd65c); }
.bg-cyan { background: linear-gradient(160deg, #c7eedb, #8eddc1); }
.bg-blue { background: linear-gradient(160deg, #c8d8ff, #9eb7f5); }
.bg-green { background: linear-gradient(160deg, #d4f5c9, #9fd97d); }
.bg-orange { background: linear-gradient(160deg, #ffd9b8, #ffb37d); }
.bg-purple { background: linear-gradient(160deg, #e5d9ff, #c0a6f5); }
.bg-pink { background: linear-gradient(160deg, #ffd0e0, #ff9dbd); }
.bg-black { background: linear-gradient(160deg, #2c2c2c, #0a0a0a); }
.bg-gold { background: linear-gradient(160deg, #ffe27a, #ffb800); }
.bg-gd { background: linear-gradient(160deg, #8cc6ff, #2e8fff); }
.bg-taobao { background: linear-gradient(160deg, #ff8a3d, #ff5000); }

/* 美团 / 抖音 角标 */
.icon-badge {
  position: absolute; top: -3px; left: -5px;
  background: #ffd83d; color: #000; font-size: 9px; font-weight: 700;
  padding: 2px 5px; border-radius: 5px; line-height: 1; letter-spacing: 0;
  box-shadow: 0 1px 2px rgba(0,0,0,.1);
  font-family: -apple-system, sans-serif;
}
/* "字"角标 */
.icon-badge-tag-zhong {
  position: absolute; top: -2px; right: -5px;
  background: #ff5757; color: #fff; font-size: 9px; font-weight: 700;
  width: 14px; height: 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; line-height: 1;
  box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
/* 抖音"乐"角标 */
.icon-badge-tag-lv {
  position: absolute; top: -2px; right: -5px;
  background: #5b8def; color: #fff; font-size: 9px; font-weight: 700;
  width: 14px; height: 14px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; line-height: 1;
  box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
/* 抖音头像 */
.douyin-avatar {
  position: absolute; bottom: -3px; right: -4px;
  width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #fff;
  background: linear-gradient(135deg,#ff5e8e,#7d6bff);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 9px; font-weight: 700;
  box-shadow: 0 1px 2px rgba(0,0,0,.2);
}

/* "去开通"按钮 */
.open-btn {
  margin-top: 6px;
  font-size: 11px; color: #5a5a5a;
  background: #fff; border: 1px solid #d8d8d8;
  padding: 3px 10px; border-radius: 11px;
  display: inline-block; line-height: 1.2;
}

/* 分割线（团购核销组里"去开通" / "核销记录" 之间） */
.divider-v {
  position: absolute; width: 1px; background: #ececec; top: 10px; bottom: 10px; left: 75%;
}
</style>
</head>
