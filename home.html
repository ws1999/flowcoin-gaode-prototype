<script>
/* ===== 活动轮播：自动播放 4s + 触摸/鼠标拖动 ===== */
(function () {
  var carousel = document.getElementById('carousel');
  var track = document.getElementById('carouselTrack');
  var total = track.children.length;
  var index = 0, timer = null, dragging = false, moved = 0;
  var startX = 0, base = 0, touchJustEnded = 0;
  var AUTO_MS = 4000;

  function goTo(i, animate) {
    index = (i + total) % total;
    track.style.transition = animate === false ? 'none' : '';
    track.style.transform = 'translateX(-' + (index * 100) + '%)';
    if (animate === false) {
      requestAnimationFrame(function () { track.style.transition = ''; });
    }
  }
  function startAuto() { stopAuto(); timer = setInterval(function () { goTo(index + 1); }, AUTO_MS); }
  function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }

  function dragStart(x) {
    stopAuto(); dragging = true; moved = 0;
    startX = x;
    base = -index * carousel.clientWidth;
    track.style.transition = 'none';
  }
  function dragMove(x) {
    if (!dragging) return;
    moved = Math.abs(x - startX);
    track.style.transform = 'translateX(' + (base + (x - startX)) + 'px)';
  }
  function dragEnd(x) {
    if (!dragging) return;
    dragging = false;
    track.style.transition = '';
    var dx = x - startX;
    var threshold = carousel.clientWidth * 0.2;
    if (dx <= -threshold) goTo(index + 1);
    else if (dx >= threshold) goTo(index - 1);
    else goTo(index);
    startAuto();
  }

  /* 触摸滑动 */
  carousel.addEventListener('touchstart', function (e) { dragStart(e.touches[0].clientX); }, { passive: true });
  carousel.addEventListener('touchmove', function (e) { dragMove(e.touches[0].clientX); }, { passive: true });
  carousel.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    if (t) dragEnd(t.clientX);
    else { dragging = false; goTo(index); startAuto(); }
    touchJustEnded = Date.now();
  });

  /* 鼠标拖动（桌面） */
  carousel.addEventListener('mousedown', function (e) {
    if (Date.now() - touchJustEnded < 600) return; /* 忽略触摸后的兼容鼠标事件 */
    dragStart(e.clientX);
    e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) { dragMove(e.clientX); });
  window.addEventListener('mouseup', function (e) { dragEnd(e.clientX); });

  /* 拖动后阻止 CTA 误触跳转 */
  track.addEventListener('click', function (e) {
    if (moved > 8) { e.preventDefault(); e.stopPropagation(); moved = 0; }
  }, true);

  /* 悬停暂停自动播放 */
  carousel.addEventListener('mouseenter', stopAuto);
  carousel.addEventListener('mouseleave', startAuto);

  goTo(0, false);
  startAuto();
})();
</script>
